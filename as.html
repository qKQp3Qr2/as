<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <title>A/S 檢討 3D 模擬</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: "Noto Sans TC", "Segoe UI", sans-serif;
        }

        #controls {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
            padding: 16px 20px;
            width: 260px;
            z-index: 10;
        }

        #controls h1 {
            margin: 0 0 12px;
            font-size: 20px;
        }

        #controls label {
            display: block;
            font-size: 13px;
            margin-bottom: 10px;
        }

        #controls input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            font-size: 13px;
        }

        #controls button {
            margin-top: 8px;
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #controls button:hover {
            background: #1d4ed8;
        }

        #results {
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
            line-height: 1.5;
        }

        #legend {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(15, 23, 42, 0.82);
            color: #e2e8f0;
            padding: 10px 14px;
            font-size: 12px;
            border-radius: 8px;
            line-height: 1.6;
            z-index: 8;
        }

        #legend span {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 6px;
            border-radius: 3px;
        }

        canvas {
            display: block;
        }

        .dimension-label {
            font-family: "Noto Sans TC", "Segoe UI", sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 10px;
            background: rgba(15, 23, 42, 0.85);
            color: #f8fafc;
            border-radius: 12px;
            pointer-events: auto;
            white-space: nowrap;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.25);
            border: 1px solid rgba(226, 232, 240, 0.18);
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .dimension-label.is-active {
            background: rgba(249, 115, 22, 0.92);
            box-shadow: 0 10px 28px rgba(249, 115, 22, 0.4);
            border-color: rgba(249, 115, 22, 0.6);
        }
    </style>
</head>

<body>
    <div id="controls">
        <h1>A/S 檢討 3D 模擬</h1>
        <label>
            基地沿路長 L (m)
            <input id="inputL" type="number" min="1" value="50" step="1">
        </label>
        <label>
            道路寬度 Sw (m)
            <input id="inputSw" type="number" min="1" value="20" step="1">
        </label>
        <label>
            退縮距離 D (m)
            <input id="inputD" type="number" min="0" value="6" step="0.5">
        </label>
        <label>
            建築高度 BH (m)
            <input id="inputH" type="number" min="1" value="0" step="0.1" readonly>
        </label>
        <label>
            建築深度 T (m)
            <input id="inputDepth" type="number" min="5" value="30" step="1">
        </label>
        <label>
            建築沿路寬度 W (m)
            <input id="inputWidth" type="number" min="5" value="40" step="1">
        </label>
        <button id="updateBtn">更新模型</button>
        <div id="results"></div>
    </div>

    <div id="legend">
        <div><span style="background:#94a3b8;"></span>基地/道路平面</div>
        <div><span style="background:#2563eb;"></span>建築量體</div>
        <div><span style="background:#22c55e;"></span>建築高度水平面</div>
        <div><span style="background:#f59e0b;"></span>斜率控制面</div>
    </div>

    <canvas id="scene"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

        const canvas = document.getElementById("scene");
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = "absolute";
        labelRenderer.domElement.style.top = "0";
        labelRenderer.domElement.style.left = "0";
        labelRenderer.domElement.style.pointerEvents = "none";
        labelRenderer.domElement.style.zIndex = "5";
        document.body.appendChild(labelRenderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf1f5f9);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 4000);
        camera.position.set(140, 120, 160);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(200, 300, 200);
        scene.add(dirLight);

        const grid = new THREE.GridHelper(400, 40, 0x94a3b8, 0xcbd5f5);
        grid.rotation.x = Math.PI / 2;
        grid.position.y = -0.1;
        scene.add(grid);

        const axes = new THREE.AxesHelper(80);
        axes.position.y = 0.1;
        scene.add(axes);

        function createTextLabel(message, options = {}) {
            const {
                fontSize = "14px",
                padding = "6px 10px",
                backgroundColor = "rgba(15, 23, 42, 0.85)",
                textColor = "#f8fafc",
                borderRadius = "12px",
                fontFamily = '"Noto Sans TC", "Segoe UI", sans-serif',
                fontWeight = "600"
            } = options;

            const element = document.createElement("div");
            element.className = "dimension-label";
            element.textContent = message;
            element.style.fontSize = fontSize;
            element.style.padding = padding;
            element.style.background = backgroundColor;
            element.style.color = textColor;
            element.style.borderRadius = borderRadius;
            element.style.fontFamily = fontFamily;
            element.style.fontWeight = fontWeight;

            return new CSS2DObject(element);
        }

        function createDimensionLine(start, end, label, options = {}) {
            const startVec = start.clone();
            const endVec = end.clone();
            const group = new THREE.Group();
            const highlightMaterials = [];
            const materialDefaults = [];

            const trackMaterial = material => {
                highlightMaterials.push(material);
                materialDefaults.push({
                    color: material.color.getHex(),
                    opacity: material.opacity
                });
            };

            const color = options.color ?? 0x0f172a;
            const lineMaterial = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.9 });
            const lineGeometry = new THREE.BufferGeometry().setFromPoints([startVec, endVec]);
            const dimensionLine = new THREE.Line(lineGeometry, lineMaterial);
            group.add(dimensionLine);
            trackMaterial(lineMaterial);

            const direction = new THREE.Vector3().subVectors(endVec, startVec);
            const length = direction.length();

            if (length > 1e-4) {
                const markerSize = options.markerSize ?? Math.min(2, Math.max(0.5, length * 0.08));
                const markerDirection = direction.clone().normalize();
                const up = new THREE.Vector3(0, 1, 0);
                const cross = new THREE.Vector3().crossVectors(markerDirection, up);

                if (cross.lengthSq() < 1e-4) {
                    cross.set(1, 0, 0);
                } else {
                    cross.normalize();
                }

                cross.multiplyScalar(markerSize / 2);

                const startMarkerGeometry = new THREE.BufferGeometry().setFromPoints([
                    startVec.clone().add(cross),
                    startVec.clone().sub(cross)
                ]);

                const endMarkerGeometry = new THREE.BufferGeometry().setFromPoints([
                    endVec.clone().add(cross),
                    endVec.clone().sub(cross)
                ]);

                const startMarkerMaterial = lineMaterial.clone();
                const endMarkerMaterial = lineMaterial.clone();

                group.add(new THREE.Line(startMarkerGeometry, startMarkerMaterial));
                group.add(new THREE.Line(endMarkerGeometry, endMarkerMaterial));

                trackMaterial(startMarkerMaterial);
                trackMaterial(endMarkerMaterial);
            }

            const labelOffset = options.labelOffset ?? new THREE.Vector3(0, 2.2, 0);
            const labelOptions = options.labelOptions ?? options.spriteOptions ?? {};
            const labelObject = createTextLabel(label, labelOptions);
            const midPoint = startVec.clone().add(endVec).multiplyScalar(0.5).add(labelOffset);
            labelObject.position.copy(midPoint);
            group.add(labelObject);

            const highlightColor = options.highlightColor ?? 0xf97316;
            const highlightOpacity = options.highlightOpacity ?? 1;

            const labelDefaults = {
                background: labelObject.element.style.background,
                color: labelObject.element.style.color,
                boxShadow: labelObject.element.style.boxShadow,
                borderColor: labelObject.element.style.borderColor
            };

            const labelHighlight = {
                background: options.labelHighlightBackground ?? "rgba(249, 115, 22, 0.92)",
                color: options.labelHighlightColor ?? "#fff",
                boxShadow: options.labelHighlightShadow ?? "0 10px 28px rgba(249, 115, 22, 0.4)",
                borderColor: options.labelHighlightBorder ?? "rgba(249, 115, 22, 0.6)"
            };

            group.userData.labelElement = labelObject.element;
            group.userData.highlightConfig = {
                materials: highlightMaterials,
                defaults: materialDefaults,
                highlightColor,
                highlightOpacity,
                labelDefaults,
                labelHighlight
            };

            return group;
        }

        let modelGroup = null;
        const dimensionInteractions = [];
        let activeInteraction = null;

        function deactivateInteraction(interaction) {
            interaction.element.classList.remove("is-active");
            interaction.materials.forEach((material, index) => {
                const defaults = interaction.defaults[index];
                material.color.setHex(defaults.color);
                material.opacity = defaults.opacity;
            });

            if (interaction.labelDefaults) {
                interaction.element.style.background = interaction.labelDefaults.background;
                interaction.element.style.color = interaction.labelDefaults.color;
                interaction.element.style.boxShadow = interaction.labelDefaults.boxShadow;
                interaction.element.style.borderColor = interaction.labelDefaults.borderColor;
            }
        }

        function cleanupDimensionInteractions() {
            if (activeInteraction) {
                deactivateInteraction(activeInteraction);
                activeInteraction = null;
            }

            while (dimensionInteractions.length) {
                const interaction = dimensionInteractions.pop();
                interaction.element.removeEventListener("click", interaction.handler);
                interaction.element.classList.remove("is-active");
                interaction.materials.forEach((material, index) => {
                    const defaults = interaction.defaults[index];
                    material.color.setHex(defaults.color);
                    material.opacity = defaults.opacity;
                });
            }
        }

        function registerDimensionInteraction(group) {
            const config = group?.userData?.highlightConfig;
            const element = group?.userData?.labelElement;

            if (!config || !element) {
                return;
            }

            const interaction = {
                element,
                materials: config.materials,
                defaults: config.defaults,
                highlightColor: config.highlightColor,
                highlightOpacity: config.highlightOpacity,
                labelDefaults: config.labelDefaults,
                labelHighlight: config.labelHighlight,
                handler: null
            };

            element.style.pointerEvents = "auto";
            element.style.cursor = "pointer";

            interaction.handler = event => {
                event.stopPropagation();

                if (activeInteraction === interaction) {
                    deactivateInteraction(interaction);
                    activeInteraction = null;
                    return;
                }

                if (activeInteraction) {
                    deactivateInteraction(activeInteraction);
                }

                interaction.element.classList.add("is-active");
                interaction.materials.forEach(material => {
                    material.color.setHex(interaction.highlightColor);
                    material.opacity = interaction.highlightOpacity;
                });

                if (interaction.labelHighlight) {
                    interaction.element.style.background = interaction.labelHighlight.background;
                    interaction.element.style.color = interaction.labelHighlight.color;
                    interaction.element.style.boxShadow = interaction.labelHighlight.boxShadow;
                    interaction.element.style.borderColor = interaction.labelHighlight.borderColor;
                }

                activeInteraction = interaction;
            };

            element.addEventListener("click", interaction.handler);
            dimensionInteractions.push(interaction);
        }

        document.addEventListener("click", () => {
            if (!activeInteraction) {
                return;
            }
            deactivateInteraction(activeInteraction);
            activeInteraction = null;
        });

        function buildModel(params) {
            const { L, Sw, D, buildingHeight, depth, width, controlDistance, controlHeight, slopeLimitAtFront } = params;
            if (modelGroup) {
                cleanupDimensionInteractions();
                scene.remove(modelGroup);
            }

            modelGroup = new THREE.Group();
            scene.add(modelGroup);

            const totalDepth = Sw + D + depth;
            const planeGeo = new THREE.PlaneGeometry(L, totalDepth + 20);
            planeGeo.rotateX(-Math.PI / 2);
            planeGeo.translate(0, 0, (Sw - D - depth) / 2);
            const planeMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0, roughness: 0.9, side: THREE.DoubleSide });
            const planeMesh = new THREE.Mesh(planeGeo, planeMat);
            modelGroup.add(planeMesh);

            const roadGeo = new THREE.PlaneGeometry(L, Sw);
            roadGeo.rotateX(-Math.PI / 2);
            roadGeo.translate(0, 0.05, Sw / 2);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, side: THREE.DoubleSide });
            const roadMesh = new THREE.Mesh(roadGeo, roadMat);
            modelGroup.add(roadMesh);

            const slopeAllowance = slopeLimitAtFront ?? params.H ?? buildingHeight;
            const buildingColor = buildingHeight <= Math.min(params.H ?? buildingHeight, slopeAllowance) + 1e-3 ? 0x2563eb : 0xef4444;
            const buildGeo = new THREE.BoxGeometry(width, buildingHeight, depth);
            const buildMat = new THREE.MeshStandardMaterial({ color: buildingColor, transparent: true, opacity: 0.85 });
            const buildMesh = new THREE.Mesh(buildGeo, buildMat);
            buildMesh.position.set(0, buildingHeight / 2, -D - depth / 2);
            modelGroup.add(buildMesh);

            const heightPlaneGeo = new THREE.PlaneGeometry(L, totalDepth + 20);
            heightPlaneGeo.rotateX(-Math.PI / 2);
            heightPlaneGeo.translate(0, 0, (Sw - D - depth) / 2);
            const heightPlaneMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
            const heightPlaneMesh = new THREE.Mesh(heightPlaneGeo, heightPlaneMat);
            heightPlaneMesh.position.set(0, buildingHeight, 0);
            modelGroup.add(heightPlaneMesh);

            const maxHeight = params.H ?? buildingHeight;
            if (maxHeight > 0) {
                const maxPlaneGeo = new THREE.PlaneGeometry(L, totalDepth + 20);
                maxPlaneGeo.rotateX(-Math.PI / 2);
                maxPlaneGeo.translate(0, 0, (Sw - D - depth) / 2);
                const maxPlaneMat = new THREE.MeshStandardMaterial({ color: 0xef4444, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
                const maxPlaneMesh = new THREE.Mesh(maxPlaneGeo, maxPlaneMat);
                maxPlaneMesh.position.set(0, maxHeight, 0);
                modelGroup.add(maxPlaneMesh);
            }

            const distance = Math.min(Math.max(controlDistance ?? 0, 0), Sw);
            const controlZ = distance;
            const usableHeight = Math.min(params.H, params.slopeHeight ?? controlHeight ?? params.H);
            const halfWidth = width / 2;

            const slopeRatio = 3.6;
            const slopeRun = usableHeight > 0 ? usableHeight / slopeRatio : 0;
            const frontZ = controlZ;
            const backZ = frontZ - slopeRun;

            const controlGeo = new THREE.BufferGeometry();
            const controlVertices = new Float32Array([
                -halfWidth, 0, frontZ,
                halfWidth, 0, frontZ,
                -halfWidth, usableHeight, backZ,

                -halfWidth, usableHeight, backZ,
                halfWidth, 0, frontZ,
                halfWidth, usableHeight, backZ
            ]);
            controlGeo.setAttribute("position", new THREE.BufferAttribute(controlVertices, 3));
            controlGeo.computeVertexNormals();
            const controlMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
            const controlMesh = new THREE.Mesh(controlGeo, controlMat);
            modelGroup.add(controlMesh);

            if (slopeRun > 0) {
                const footprintGeo = new THREE.PlaneGeometry(width, slopeRun);
                footprintGeo.rotateX(-Math.PI / 2);
                footprintGeo.translate(0, 0.03, frontZ - slopeRun / 2);
                const footprintMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
                const footprintMesh = new THREE.Mesh(footprintGeo, footprintMat);
                modelGroup.add(footprintMesh);
            }

            if (maxHeight > buildingHeight + 1e-3) {
                const zAtCurrent = frontZ - (buildingHeight / slopeRatio);
                const zAtMax = frontZ - (maxHeight / slopeRatio);
                const extensionGeo = new THREE.BufferGeometry();
                const extensionVertices = new Float32Array([
                    -halfWidth, buildingHeight, zAtCurrent,
                    halfWidth, buildingHeight, zAtCurrent,
                    -halfWidth, maxHeight, zAtMax,

                    -halfWidth, maxHeight, zAtMax,
                    halfWidth, buildingHeight, zAtCurrent,
                    halfWidth, maxHeight, zAtMax
                ]);
                extensionGeo.setAttribute("position", new THREE.BufferAttribute(extensionVertices, 3));
                extensionGeo.computeVertexNormals();
                const extensionMat = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
                const extensionMesh = new THREE.Mesh(extensionGeo, extensionMat);
                modelGroup.add(extensionMesh);
            }

            const setbackLineGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-width / 2, 0.02, -D),
                new THREE.Vector3(width / 2, 0.02, -D)
            ]);
            const setbackLineMat = new THREE.LineBasicMaterial({ color: 0x0f172a, linewidth: 2 });
            const setbackLine = new THREE.Line(setbackLineGeo, setbackLineMat);
            modelGroup.add(setbackLine);

            const dimensionGroup = new THREE.Group();
            modelGroup.add(dimensionGroup);

            const widthLine = createDimensionLine(
                new THREE.Vector3(-width / 2, 0.12, -D),
                new THREE.Vector3(width / 2, 0.12, -D),
                `沿路寬度 W = ${formatNumber(width)} m`,
                {
                    labelOffset: new THREE.Vector3(0, 2.8, 0),
                    spriteOptions: { scale: 0.02, fontSize: 110 }
                }
            );
            dimensionGroup.add(widthLine);
            registerDimensionInteraction(widthLine);

            const depthLine = createDimensionLine(
                new THREE.Vector3(width / 2 + 0.6, 0.12, -D),
                new THREE.Vector3(width / 2 + 0.6, 0.12, -D - depth),
                `建築深度 T = ${formatNumber(depth)} m`,
                {
                    labelOffset: new THREE.Vector3(0, 2.6, 0),
                    spriteOptions: { scale: 0.02, fontSize: 110 }
                }
            );
            dimensionGroup.add(depthLine);
            registerDimensionInteraction(depthLine);

            const setbackDimensionLine = createDimensionLine(
                new THREE.Vector3(-width / 2 - 0.6, 0.12, 0),
                new THREE.Vector3(-width / 2 - 0.6, 0.12, -D),
                `退縮距離 D = ${formatNumber(D)} m`,
                {
                    labelOffset: new THREE.Vector3(0, 2.6, 0),
                    spriteOptions: { scale: 0.02, fontSize: 110 }
                }
            );
            dimensionGroup.add(setbackDimensionLine);
            registerDimensionInteraction(setbackDimensionLine);

            const heightLine = createDimensionLine(
                new THREE.Vector3(width / 2, 0, -D - depth / 2),
                new THREE.Vector3(width / 2, buildingHeight, -D - depth / 2),
                `建築高度 BH = ${formatNumber(buildingHeight)} m`,
                {
                    labelOffset: new THREE.Vector3(2.4, 0, 0),
                    spriteOptions: { scale: 0.02, fontSize: 110 },
                    markerSize: 1.2
                }
            );
            dimensionGroup.add(heightLine);
            registerDimensionInteraction(heightLine);

            const roadWidthLine = createDimensionLine(
                new THREE.Vector3(width / 2 + 1.4, 0.12, 0),
                new THREE.Vector3(width / 2 + 1.4, 0.12, Sw),
                `道路寬度 Sw = ${formatNumber(Sw)} m`,
                {
                    labelOffset: new THREE.Vector3(0, 2.6, 0),
                    spriteOptions: { scale: 0.02, fontSize: 110 }
                }
            );
            dimensionGroup.add(roadWidthLine);
            registerDimensionInteraction(roadWidthLine);

            const controlDistanceLine = createDimensionLine(
                new THREE.Vector3(-width / 2 - 1.4, 0.12, 0),
                new THREE.Vector3(-width / 2 - 1.4, 0.12, params.controlDistance),
                `斜率控制距離 = ${formatNumber(params.controlDistance)} m`,
                {
                    labelOffset: new THREE.Vector3(0, 2.6, 0),
                    spriteOptions: { scale: 0.02, fontSize: 110 }
                }
            );
            dimensionGroup.add(controlDistanceLine);
            registerDimensionInteraction(controlDistanceLine);

            const lengthLine = createDimensionLine(
                new THREE.Vector3(-L / 2, 0.12, Sw + 2),
                new THREE.Vector3(L / 2, 0.12, Sw + 2),
                `基地沿路長 L = ${formatNumber(L)} m`,
                {
                    labelOffset: new THREE.Vector3(0, 2.8, 0),
                    spriteOptions: { scale: 0.02, fontSize: 110 }
                }
            );
            dimensionGroup.add(lengthLine);
            registerDimensionInteraction(lengthLine);

            if (params.H > 0) {
                const heightLimitLine = createDimensionLine(
                    new THREE.Vector3(-width / 2 - 2.4, 0, -D - depth / 2),
                    new THREE.Vector3(-width / 2 - 2.4, params.H, -D - depth / 2),
                    `高度限制 H = ${formatNumber(params.H)} m`,
                    {
                        labelOffset: new THREE.Vector3(-2.2, 0, 0),
                        spriteOptions: { scale: 0.02, fontSize: 110 },
                        markerSize: 1.2
                    }
                );
                dimensionGroup.add(heightLimitLine);
                registerDimensionInteraction(heightLimitLine);
            }
        }

        function computeResults(params) {
            const { L, Sw, D, buildingHeight } = params;
            const AsLimit = (L * Sw) / 2;
            const H = 3.6 * (Sw + D);
            const horizontalReach = Math.max(0, 2 * buildingHeight - D);
            const actualBase = Math.min(Sw, horizontalReach);
            const AsActual = 0.5 * L * actualBase;

            return {
                AsLimit,
                H,
                AsActual,
                actualBase,
                horizontalReach
            };
        }

        function computeSlopeHeightAtZ(z, params) {
            const slopeRatio = 3.6;
            const usableHeight = Math.max(0, params.usableSlopeHeight ?? params.H ?? 0);
            if (usableHeight === 0) {
                return 0;
            }

            const distance = Math.min(Math.max(params.controlDistance ?? 0, 0), params.Sw ?? 0);
            const frontZ = distance;
            const slopeRun = usableHeight / slopeRatio;
            const backZ = frontZ - slopeRun;

            if (z >= frontZ) {
                return 0;
            }

            if (z <= backZ) {
                return usableHeight;
            }

            return (frontZ - z) * slopeRatio;
        }

        function formatNumber(num) {
            return num.toLocaleString(undefined, { maximumFractionDigits: 2 });
        }

        function update() {
            const widthInput = document.getElementById("inputWidth");
            const heightInput = document.getElementById("inputH");

            const params = {
                L: Number(document.getElementById("inputL").value) || 1,
                Sw: Number(document.getElementById("inputSw").value) || 1,
                D: Number(document.getElementById("inputD").value) || 0,
                depth: Number(document.getElementById("inputDepth").value) || 5,
                width: Number(widthInput.value) || 5
            };

            if (params.width > params.L) {
                params.width = params.L;
                widthInput.value = params.width;
            }

            params.H = 3.6 * (params.Sw + params.D);

            let trialBuildingHeight = params.H;
            let controlDistance = 0;
            let controlHeight = params.H;
            let usableSlopeHeight = params.H;
            let slopeLimitAtFront = params.H;
            let slopeRun = 0;
            let results = null;

            for (let i = 0; i < 8; i++) {
                results = computeResults({ ...params, buildingHeight: trialBuildingHeight });
                const rawDistance = params.width > 0 ? results.AsActual / params.width : 0;
                controlDistance = Math.min(Math.max(rawDistance, 0), params.Sw);
                controlHeight = Math.min(3.6 * (controlDistance + params.D), params.H);
                usableSlopeHeight = Math.min(params.H, controlHeight);
                slopeRun = usableSlopeHeight > 0 ? usableSlopeHeight / 3.6 : 0;
                slopeLimitAtFront = computeSlopeHeightAtZ(-params.D, {
                    Sw: params.Sw,
                    controlDistance,
                    usableSlopeHeight,
                    H: params.H
                });
                const nextBuildingHeight = Math.min(params.H, slopeLimitAtFront);
                if (Math.abs(nextBuildingHeight - trialBuildingHeight) < 1e-3) {
                    trialBuildingHeight = nextBuildingHeight;
                    break;
                }
                trialBuildingHeight = nextBuildingHeight;
            }

            params.buildingHeight = trialBuildingHeight;
            params.controlDistance = controlDistance;
            params.controlHeight = controlHeight;
            params.usableSlopeHeight = usableSlopeHeight;
            params.slopeRun = slopeRun;
            params.slopeLimitAtFront = slopeLimitAtFront;
            params.slopeHeight = usableSlopeHeight;

            if (heightInput) {
                heightInput.value = params.buildingHeight.toFixed(2);
            }

            results = computeResults(params);

            buildModel(params);

            document.getElementById("results").innerHTML = `
                <b>檢核結果</b><br>
                A/S 限制：${formatNumber(results.AsLimit)} m²<br>
                建築高度：${formatNumber(params.buildingHeight)} m<br>
                高度限制：${formatNumber(results.H)} m<br>
                建築可用高度來源：3.6 × (Sw + D)<br>
                與斜率控制取最小值
            `;

            controls.target.set(0, Math.min(params.buildingHeight / 2, 80), -params.depth / 2);
        }
        ["inputL", "inputSw", "inputD", "inputDepth", "inputWidth"].forEach(id => {
            document.getElementById(id).addEventListener("change", update);
        });

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        update();
        animate();
    </script>
</body>

</html>
